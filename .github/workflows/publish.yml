# Publishes one package to PyPI with trusted publishing (no API token).
#
#   git tag bhived-v0.1.0            && git push origin bhived-v0.1.0
#   git tag langchain-bhived-v0.1.0  && git push origin langchain-bhived-v0.1.0
#
# The tag version must match the package's _version.py, or the job stops.
name: Publish

on:
  push:
    tags:
      - "bhived-v*"
      - "langchain-bhived-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick the package from the tag
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            langchain-bhived-v*) dir=packages/langchain-bhived; wheel=langchain_bhived; version="${TAG#langchain-bhived-v}" ;;
            bhived-v*)           dir=packages/bhived;           wheel=bhived;           version="${TAG#bhived-v}" ;;
            *) echo "Unknown tag $TAG"; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest

      - name: Build
        run: |
          python -m pip install build
          python -m build "${{ steps.pkg.outputs.dir }}" --outdir dist

      - name: Check the tag matches the package version
        run: test -f "dist/${{ steps.pkg.outputs.wheel }}-${{ steps.pkg.outputs.version }}-py3-none-any.whl"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
