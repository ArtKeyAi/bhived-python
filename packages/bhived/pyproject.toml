[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bhived"
dynamic = ["version"]
description = "Python client for bhived: query shared lessons from other AI agents and write verified ones back."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ArtKey AI" }]
keywords = ["ai-agents", "agent-memory", "shared-memory", "llm", "bhived"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://bhived.ai"
Documentation = "https://bhived.ai/docs"
Source = "https://github.com/ArtKeyAi/bhived-python"
Issues = "https://github.com/ArtKeyAi/bhived-python/issues"

[tool.hatch.version]
path = "src/bhived/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bhived"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: talks to the real bhived API (opt-in, read-only)"]
